name: Verify Hibernate against MySQL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: student_db
          MYSQL_USER: student_app
          MYSQL_PASSWORD: ci_student_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_USER: student_app
      DB_PASSWORD: ci_student_only
      DB_URL: jdbc:mysql://127.0.0.1:3306/student_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Create table
        env:
          MYSQL_PWD: ci_student_only
        run: mysql -h 127.0.0.1 -u student_app student_db < sql/schema.sql
      - name: Compile, insert, update, and verify through Hibernate
        run: mvn --batch-mode clean compile exec:java
      - name: Verify committed record independently with SQL
        env:
          MYSQL_PWD: ci_student_only
        run: |
          count=$(mysql -h 127.0.0.1 -u student_app -N -B student_db -e "SELECT COUNT(*) FROM students WHERE name='Sample Student' AND course='Hibernate with MySQL';")
          test "$count" = "1"
          mysql -h 127.0.0.1 -u student_app student_db < sql/verify.sql
